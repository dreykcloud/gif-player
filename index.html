<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090b10">
<title>GIF Player</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#090b10;touch-action:none}
#gif{position:absolute;left:50%;top:50%;width:auto;height:auto;max-width:none;max-height:none;transform-origin:center center;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;color:#dce1eb}
#empty .symbol{font-size:52px}
#empty p{max-width:300px;color:#9ca6b7;line-height:1.45;margin:0}
button,.filelabel{border:0;border-radius:14px;background:#f0f3fa;color:#10131a;padding:13px 18px;font-size:16px;font-weight:650}
#toolbar{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #343b49;border-radius:18px;background:rgba(18,22,30,.88);backdrop-filter:blur(18px);transition:opacity .25s}
#toolbar.hidden{opacity:0;pointer-events:none}
#pick{display:none}
#openBtn{white-space:nowrap;padding:11px 13px;font-size:14px}
#speedBox{min-width:0;flex:1}
#speedTop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c4ccda;margin-bottom:6px}
#speedVal{font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
input[type=range]{width:100%;accent-color:#fff;margin:0}
#hint{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;padding:8px 12px;border-radius:30px;background:rgba(18,22,30,.68);color:#d7deea;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
#hint.fade{opacity:0}
#err{position:fixed;left:18px;right:18px;top:50%;transform:translateY(-50%);text-align:center;color:#ffb6b6;font-size:14px;display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="empty">
    <div class="symbol">∞</div>
    <strong>Dein GIF-Player</strong>
    <p>Wähle ein GIF aus. Es startet bildschirmfüllend und läuft in Endlosschleife. Ziehe es mit einem Finger frei über den Bildschirm.</p>
    <label class="filelabel" for="pick">GIF auswählen</label>
  </div>
  <canvas id="gif" hidden></canvas>
  <div id="err"></div>
</div>
<div id="hint">Mit einem Finger ziehen · Doppeltippen: Bedienelemente</div>
<div id="toolbar">
  <label id="openBtn" class="filelabel" for="pick">GIF öffnen</label>
  <input id="pick" type="file" accept="image/gif,.gif">
  <div id="speedBox">
    <div id="speedTop"><span>Geschwindigkeit</span><span id="speedVal">1,00×</span></div>
    <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Wiedergabegeschwindigkeit">
  </div>
</div>
<script type="module">
import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';

const stage=document.querySelector('#stage'), canvas=document.querySelector('#gif'), ctx=canvas.getContext('2d');
const empty=document.querySelector('#empty'), picker=document.querySelector('#pick'), speed=document.querySelector('#speed');
const speedVal=document.querySelector('#speedVal'), toolbar=document.querySelector('#toolbar'), hint=document.querySelector('#hint'), err=document.querySelector('#err');
let frames=[], frameIndex=0, timer=null, rate=1, posX=0, posY=0, scale=1, baseW=0, baseH=0, dragging=false, startX=0, startY=0, originX=0, originY=0, lastTap=0, controlsTimer=null;

function showError(msg){err.textContent=msg;err.style.display='block';}
function fitToScreen(){
  if(!canvas.width||!canvas.height)return;
  const w=stage.clientWidth,h=stage.clientHeight;
  scale=Math.max(w/canvas.width,h/canvas.height);
  baseW=canvas.width;baseH=canvas.height;
  posX=0;posY=0;applyTransform();
}
function applyTransform(){
  canvas.style.width=(baseW*scale)+'px';
  canvas.style.height=(baseH*scale)+'px';
  canvas.style.transform=`translate(calc(-50% + ${posX}px),calc(-50% + ${posY}px))`;
}
function drawFrame(i){
  if(!frames.length)return;
  const f=frames[i], d=f.dims;
  const patch=new ImageData(new Uint8ClampedArray(f.patch),d.width,d.height);
  ctx.putImageData(patch,d.left,d.top);
}
function nextFrame(){
  if(!frames.length)return;
  frameIndex=(frameIndex+1)%frames.length;
  const f=frames[frameIndex];
  // GIF frame patches are composited in order; clear the previous frame's area for disposal-to-background.
  if(f._clearPrevious){ctx.clearRect(f._clearPrevious.left,f._clearPrevious.top,f._clearPrevious.width,f._clearPrevious.height);}
  drawFrame(frameIndex);
  scheduleNext();
}
function scheduleNext(){
  clearTimeout(timer);
  const f=frames[frameIndex];
  const delay=Math.max(20,(f.delay||100)/rate);
  timer=setTimeout(nextFrame,delay);
}
function startPlayback(){
  clearTimeout(timer);frameIndex=0;ctx.clearRect(0,0,canvas.width,canvas.height);
  if(frames.length){drawFrame(0);scheduleNext();}
}
async function loadGif(file){
  clearTimeout(timer);err.style.display='none';
  try{
    const buffer=await file.arrayBuffer();
    const parsed=parseGIF(buffer);
    frames=decompressFrames(parsed,true);
    if(!frames.length)throw new Error('Keine abspielbaren GIF-Frames gefunden.');
    const lsd=parsed.lsd;
    canvas.width=lsd.width;canvas.height=lsd.height;
    // Precompute disposal-to-background clearing for the preceding frame.
    for(let i=1;i<frames.length;i++){
      const prev=frames[i-1];
      if(prev.disposalType===2)frames[i]._clearPrevious=prev.dims;
    }
    canvas.hidden=false;empty.style.display='none';
    fitToScreen();startPlayback();
    hint.classList.remove('fade');setTimeout(()=>hint.classList.add('fade'),3200);
  }catch(e){showError('Dieses GIF konnte nicht geöffnet werden. Bitte probiere eine andere GIF-Datei.');console.error(e);}
}
picker.addEventListener('change',e=>{const file=e.target.files?.[0];if(file)loadGif(file);picker.value='';});
speed.addEventListener('input',()=>{rate=Number(speed.value);speedVal.textContent=rate.toFixed(2).replace('.',',')+'×';if(frames.length)scheduleNext();});
stage.addEventListener('pointerdown',e=>{
  if(canvas.hidden)return;
  const now=Date.now();
  if(now-lastTap<320){toolbar.classList.toggle('hidden');lastTap=0;return;}
  lastTap=now;dragging=true;startX=e.clientX;startY=e.clientY;originX=posX;originY=posY;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{if(!dragging)return;posX=originX+(e.clientX-startX);posY=originY+(e.clientY-startY);applyTransform();});
function stopDrag(){dragging=false;}
stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);
window.addEventListener('resize',()=>{if(!canvas.hidden){const oldW=baseW*scale,oldH=baseH*scale;const w=stage.clientWidth,h=stage.clientHeight;const s=Math.max(w/canvas.width,h/canvas.height);scale=s;applyTransform();}});
</script>
</body>
</html>
